<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Gov Document Fetcher</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
<style>
  /* ── Κλιμάκωση στη διαθέσιμη οθόνη ──────────────────────────────────────
     ΟΛΑ τα μεγέθη της σελίδας είναι σε rem, οπότε αρκεί να γίνει ρευστό το
     μέγεθος της ΡΙΖΑΣ και κλιμακώνεται μαζί ολόκληρο το UI — γραμματοσειρές,
     αποστάσεις, κουμπιά. Το clamp() βάζει κάτω και πάνω όριο, ώστε σε πολύ
     μικρή οθόνη να μένει διαβάσιμο και σε πολύ μεγάλη να μη γιγαντώνεται. */
  html { font-size: clamp(12.5px, 0.42vw + 11.6px, 17px); }

  body { background:#f4f6fb; font-family:'Segoe UI',system-ui,sans-serif; }

  /* Το app πιάνει όλο το ύψος, ώστε τα panel να μοιράζονται ό,τι υπάρχει */
  .app-shell { min-height:100vh; }

  /* Πλάτος πλαϊνής μπάρας ανάλογο της οθόνης, με όρια */
  .sidebar { background:#1e293b; color:#e2e8f0;
             width:clamp(170px, 15vw, 240px); flex:0 0 auto; }
  .sidebar .brand { font-size:1.1rem;font-weight:700;padding:1.5rem 1.2rem 0.5rem;color:#fff; }
  .sidebar .brand span { color:#60a5fa; }
  .card-doc { border:2px solid #e2e8f0;border-radius:10px;transition:all .2s;background:#fff; }
  .card-doc:hover { border-color:#1a56db;background:#eff6ff; }

  /* Το log παίρνει ύψος ανάλογο του παραθύρου αντί για σταθερά 300px, ώστε σε
     κοντή οθόνη να μη σπρώχνει τα αρχεία εκτός πεδίου ορατότητας. */
  #log-box { background:#0f172a;color:#94a3b8;font-family:monospace;font-size:.82rem;
             height:clamp(150px, 30vh, 460px);
             overflow-y:auto;border-radius:8px;padding:1rem;
             overflow-wrap:anywhere; }
  #log-box .success { color:#4ade80; }
  #log-box .error   { color:#f87171; }
  #log-box .info    { color:#94a3b8; }
  .file-row { display:flex;align-items:center;gap:.6rem;padding:.5rem .8rem;
              background:#fff;border-radius:8px;border:1px solid #e2e8f0;margin-bottom:.4rem; }
  .file-row .fname { flex:1;font-size:.85rem;word-break:break-all; }
  .section-title { font-weight:700;font-size:.75rem;text-transform:uppercase;
                   letter-spacing:.08em;color:#64748b;margin-bottom:.6rem; }
  .required-star { color:#ef4444; }

  /* Η λίστα αρχείων κυλάει μόνη της, αντί να μεγαλώνει τη σελίδα χωρίς τέλος */
  #file-list { max-height:clamp(120px, 26vh, 400px); overflow-y:auto; }

  /* Σε πολύ φαρδιά οθόνη το περιεχόμενο δεν τεντώνεται άσκοπα */
  .content-cap { max-width:1600px; }

  /* Σε κοντές οθόνες (ή μεγάλο zoom) κερδίζουμε κατακόρυφο χώρο */
  @media (max-height:700px) {
    .sidebar .brand { padding-top:.9rem; padding-bottom:.3rem; }
    .card-body { padding:.85rem; }
  }
</style>
</head>
<body>
<div class="d-flex app-shell">

  <!-- Sidebar -->
  <div class="sidebar d-none d-md-flex flex-column">
    <div class="brand"><i class="bi bi-file-earmark-arrow-down me-2"></i>Gov<span>Docs</span></div>
    <hr class="border-secondary mx-3"/>
    <div class="px-3 py-1" style="font-size:.82rem;color:#94a3b8;">
      <div class="mb-2"><i class="bi bi-shield-check me-2"></i>TaxisNet</div>
      <div class="mb-2"><i class="bi bi-folder2-open me-2"></i>Αυτόματη λήψη PDF</div>
      <div class="mb-2"><i class="bi bi-pencil-square me-2"></i>Έξυπνη ονομασία</div>
    </div>
    <div class="mt-auto px-3 pb-3" style="font-size:.75rem;color:#475569;">
      Τοπική εκτέλεση.<br/>Κωδικοί δεν αποθηκεύονται.
    </div>
  </div>

  <!-- Main -->
  <div class="flex-grow-1 p-3 p-md-4 content-cap">
    <h4 class="fw-bold mb-1"><i class="bi bi-cloud-download me-2 text-primary"></i>Λήψη Εγγράφων</h4>
    <div class="text-muted mb-3" style="font-size:.85rem;">Συμπληρώστε τα στοιχεία και επιλέξτε τα έγγραφα.</div>

    <div class="row g-3">

      <!-- LEFT -->
      <div class="col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body">

            <!-- Κωδικοί -->
            <div class="section-title"><i class="bi bi-key me-1"></i>Κωδικοί TaxisNet</div>
            <div class="mb-2">
              <label class="form-label mb-1" style="font-size:.85rem;">Κωδικός Χρήστη <span class="required-star">*</span></label>
              <input id="username" type="text" class="form-control form-control-sm"
                     placeholder="TaxisNet username" autocomplete="username"/>
            </div>
            <div class="mb-3">
              <label class="form-label mb-1" style="font-size:.85rem;">Συνθηματικό <span class="required-star">*</span></label>
              <div class="input-group input-group-sm">
                <input id="password" type="password" class="form-control"
                       placeholder="••••••••" autocomplete="current-password"/>
                <button class="btn btn-outline-secondary" type="button" onclick="togglePwd()">
                  <i class="bi bi-eye" id="eye-icon"></i>
                </button>
              </div>
            </div>

            <hr class="my-2"/>

            <!-- Στοιχεία αρχείου -->
            <div class="section-title"><i class="bi bi-person me-1"></i>Στοιχεία Αρχείου</div>
            <div class="mb-2">
              <label class="form-label mb-1" style="font-size:.85rem;">Ονοματεπώνυμο / Επωνυμία <span class="required-star">*</span></label>
              <input id="client_name" type="text" class="form-control form-control-sm"
                     placeholder="π.χ. ΝΙΚΟΛΑΟΥ ΓΕΩΡΓΙΟΣ"/>
            </div>
            <div class="mb-3">
              <label class="form-label mb-1" style="font-size:.85rem;">
                Χρονολογίες <span class="required-star">*</span>
                <span class="text-muted" style="font-size:.78rem;">
                  — διάλεξε όσες θέλεις</span>
              </label>
              <div id="year-chips" class="d-flex flex-wrap gap-1"></div>
            </div>

            <hr class="my-2"/>

            <!-- Τύπος φορολογούμενου -->
            <div class="section-title"><i class="bi bi-buildings me-1"></i>Τύπος Φορολογούμενου</div>
            <div id="entity-types" class="d-flex flex-column gap-1 mb-2"></div>
            <div id="doc-chips" class="d-flex flex-wrap gap-1 mb-2"></div>

            <div class="mt-3 d-flex align-items-center gap-2">
              <button id="btn-start" class="btn btn-primary flex-grow-1" onclick="startDownload()">
                <i class="bi bi-play-fill me-1"></i>Έναρξη Λήψης
              </button>
              <div id="spinner" class="spinner-border spinner-border-sm text-primary d-none" role="status"></div>
            </div>

          </div>
        </div>
        <div id="fname-preview" class="mt-2 px-1" style="font-size:.78rem;color:#64748b;"></div>
      </div>

      <!-- RIGHT -->
      <div class="col-lg-7">

        <!-- Progress log -->
        <div class="mb-3">
          <div class="section-title mb-2"><i class="bi bi-terminal me-1"></i>Πρόοδος</div>
          <div id="log-box"><span class="info">Αναμονή εκκίνησης…</span></div>
        </div>

        <!-- Files -->
        <div>
          <div class="d-flex align-items-center mb-2">
            <div class="section-title mb-0 flex-grow-1"><i class="bi bi-folder-check me-1"></i>Ληφθέντα Αρχεία</div>
            <button class="btn btn-sm btn-outline-secondary py-0" onclick="loadFiles()">
              <i class="bi bi-arrow-clockwise"></i>
            </button>
          </div>
          <div id="files-dir" class="text-muted mb-2" style="font-size:.75rem;"></div>
          <div id="file-list"><div class="text-muted" style="font-size:.85rem;">Δεν υπάρχουν αρχεία ακόμα.</div></div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
// ─── Doc definitions ────────────────────────────────────────────
// Ατομική επιχείρηση (φυσικό πρόσωπο): ΦΠΑ, Ε3, Ε1, Εκκαθαριστικό
// Όχι ατομική (νομικό πρόσωπο):        Ν, ΦΠΑ, Ε3
const ALL_DOCS = [
  { id:"e1",             label:"Ε1 – Δήλωση Εισοδήματος",       icon:"bi-file-text", color:"#3b82f6" },
  { id:"e3",             label:"Ε3 – Οικον. Στοιχεία",          icon:"bi-briefcase", color:"#8b5cf6" },
  { id:"n",              label:"Ν – Εισοδήματος Εταιρειών",     icon:"bi-building",  color:"#0ea5e9" },
  { id:"fpa",            label:"ΦΠΑ",                            icon:"bi-percent",   color:"#ef4444" },
  { id:"ekkatharistiko", label:"Εκκαθαριστικό",                  icon:"bi-receipt",   color:"#f59e0b" },
];
const DOCS_BY_ID = Object.fromEntries(ALL_DOCS.map(d => [d.id, d]));

// Τύποι φορολογούμενου και τα έγγραφα που έχει ο καθένας.
//
// Το φυσικό πρόσωπο ΔΕΝ ασκεί επιχειρηματική δραστηριότητα: δεν έχει Ε3
// (οικονομικά στοιχεία επιχείρησης) ούτε ΦΠΑ. Παλιότερα υπήρχε μόνο ένας
// διακόπτης «Ατομική ναι/όχι», οπότε ένας ιδιώτης έπαιρνε αναγκαστικά τη λίστα
// της ατομικής και δύο έγγραφα απλώς αποτύγχαναν κάθε φορά.
const ENTITY_TYPES = [
  { id:"atomiki", label:"Ατομική Επιχείρηση", icon:"bi-shop",
    hint:"Ε1, Ε3, Εκκαθαριστικό, ΦΠΑ",  docs:["fpa", "e3", "e1", "ekkatharistiko"] },
  { id:"nomiko",  label:"Νομικό Πρόσωπο",    icon:"bi-building",
    hint:"ΟΕ, ΕΕ, ΑΕ, ΙΚΕ — Ν, Ε3, ΦΠΑ", docs:["n", "fpa", "e3"] },
  { id:"fysiko",  label:"Φυσικό Πρόσωπο",    icon:"bi-person",
    hint:"Ιδιώτης χωρίς επιχείρηση — Ε1, Εκκαθαριστικό",
    docs:["e1", "ekkatharistiko"] },
];
const ENTITY_BY_ID = Object.fromEntries(ENTITY_TYPES.map(t => [t.id, t]));
let entityType = "atomiki";

function renderEntityTypes() {
  const box = document.getElementById("entity-types");
  box.innerHTML = "";
  for (const t of ENTITY_TYPES) {
    const on = entityType === t.id;
    const el = document.createElement("label");
    el.className = "d-flex align-items-center gap-2 p-2 card-doc";
    el.style.cssText = "cursor:pointer;" +
      (on ? "border-color:#1a56db;background:#eff6ff;" : "");
    el.innerHTML =
      `<input type="radio" name="entity" class="form-check-input mt-0"
              ${on ? "checked" : ""}/>
       <span class="flex-grow-1">
         <span style="font-size:.85rem;"><i class="bi ${t.icon} me-1"></i>${t.label}</span>
         <br><span class="text-muted" style="font-size:.72rem;">${t.hint}</span>
       </span>`;
    el.onclick = () => { entityType = t.id; renderEntityTypes(); updateDocSelection(); };
    box.appendChild(el);
  }
}

function currentDocuments() {
  return ENTITY_BY_ID[entityType].docs;
}

// ─── Χρονολογίες: πολλαπλή επιλογή ──────────────────────────────
// Το τρέξιμο γίνεται με ΕΝΑ login για όλα τα επιλεγμένα έτη.
const YEAR_FROM = 2015;
const selectedYears = new Set();

function renderYears() {
  const box = document.getElementById("year-chips");
  const cy = new Date().getFullYear();
  box.innerHTML = "";
  for (let y = cy; y >= YEAR_FROM; y--) {
    const on = selectedYears.has(String(y));
    const b = document.createElement("button");
    b.type = "button";
    b.className = "btn btn-sm " + (on ? "btn-primary" : "btn-outline-secondary");
    b.style.cssText = "font-size:.78rem;padding:.15rem .5rem;";
    b.textContent = y;
    b.onclick = () => {
      const k = String(y);
      selectedYears.has(k) ? selectedYears.delete(k) : selectedYears.add(k);
      renderYears();
      updatePreview();
    };
    box.appendChild(b);
  }
}

/** Τα επιλεγμένα έτη, νεότερο πρώτα. */
function currentYears() {
  return [...selectedYears].sort().reverse();
}

// Προεπιλογή: το τρέχον έτος, ώστε η φόρμα να είναι έτοιμη για χρήση
selectedYears.add(String(new Date().getFullYear()));
renderYears();
renderEntityTypes();

function updateDocSelection() {
  const chips = document.getElementById("doc-chips");
  chips.innerHTML = currentDocuments().map(id => {
    const d = DOCS_BY_ID[id];
    return `<span class="badge rounded-pill" style="background:${d.color};font-size:.72rem;">
              <i class="bi ${d.icon} me-1"></i>${d.label.split("–")[0].trim()}
            </span>`;
  }).join("");
  updatePreview();
}
function togglePwd() {
  const p = document.getElementById("password");
  const i = document.getElementById("eye-icon");
  if (p.type==="password") { p.type="text"; i.className="bi bi-eye-slash"; }
  else { p.type="password"; i.className="bi bi-eye"; }
}
function updatePreview() {
  const name = (document.getElementById("client_name").value.trim()||"ΠΕΛΑΤΗΣ").replace(/\s+/g,"_");
  const years = currentYears();
  const docs = currentDocuments();
  const p = document.getElementById("fname-preview");
  if (!docs.length || !years.length) {
    p.innerHTML = years.length ? "" :
      `<i class="bi bi-exclamation-circle me-1 text-danger"></i>Διάλεξε τουλάχιστον μία χρονολογία.`;
    return;
  }
  const year = years[0];
  // Το όνομα φέρει το ΦΟΡΟΛΟΓΙΚΟ έτος (= έτος υποβολής - 1) — δες safe_filename()
  const fiscalYear = Number(year) - 1;
  const lbl = DOCS_BY_ID[docs[0]].label.split("–")[0].trim();
  const total = years.length * docs.length;
  p.innerHTML = `<i class="bi bi-info-circle me-1"></i>Π.χ.: <code>${fiscalYear}_${name}_${lbl}.pdf</code>`
              + `<br><i class="bi bi-calendar-check me-1"></i>Δηλώσεις έτους ${year} → φορολογικό έτος ${fiscalYear}`
              + `<br><i class="bi bi-collection me-1"></i>${years.length} ${years.length===1?"χρονολογία":"χρονολογίες"}`
              + ` × ${docs.length} έγγραφα = <strong>${total}</strong> λήψεις (${years.join(", ")})`;
}
document.getElementById("client_name").addEventListener("input", updatePreview);

// ─── Start ──────────────────────────────────────────────────────
async function startDownload() {
  const username    = document.getElementById("username").value.trim();
  const password    = document.getElementById("password").value;
  const client_name = document.getElementById("client_name").value.trim();
  const years       = currentYears();
  const documents   = currentDocuments();
  const entity_type = entityType;
  // is_atomiki: το φυσικό πρόσωπο, όπως και η ατομική, είναι Ο ΙΔΙΟΣ ο χρήστης
  // — ποτέ άλλη οντότητα. Στέλνεται και για συμβατότητα με παλιό backend.
  const is_atomiki  = entityType !== "nomiko";

  if (!username || !password) { alert("Εισάγετε κωδικούς TaxisNet."); return; }
  if (!client_name) { alert("Εισάγετε ονοματεπώνυμο πελάτη."); return; }
  if (!years.length) { alert("Διαλέξτε τουλάχιστον μία χρονολογία."); return; }

  document.getElementById("btn-start").disabled = true;
  document.getElementById("spinner").classList.remove("d-none");
  clearLog();
  appendLog("info", "⏳ Εκκίνηση…");

  const resp = await fetch("/api/start", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({username, password, client_name, years, documents,
                          entity_type, is_atomiki}),
  });
  const { session_id } = await resp.json();

  const es = new EventSource(`/api/progress/${session_id}`);
  es.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === "done") {
      es.close();
      document.getElementById("btn-start").disabled = false;
      document.getElementById("spinner").classList.add("d-none");
      loadFiles();
      return;
    }
    if (msg.message) appendLog(msg.type||"info", msg.message);
  };
  es.onerror = () => {
    es.close();
    document.getElementById("btn-start").disabled = false;
    document.getElementById("spinner").classList.add("d-none");
    loadFiles();
  };
}

// ─── Log ────────────────────────────────────────────────────────
function clearLog() { document.getElementById("log-box").innerHTML=""; }
function appendLog(level, msg) {
  const box = document.getElementById("log-box");
  const d = document.createElement("div");
  d.className = level; d.textContent = msg;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

// ─── Files ──────────────────────────────────────────────────────
async function loadFiles() {
  const [fRes, dRes] = await Promise.all([fetch("/api/files"), fetch("/api/downloads-dir")]);
  const files = await fRes.json();
  const { path } = await dRes.json();
  document.getElementById("files-dir").textContent = "📁 " + path;
  const list = document.getElementById("file-list");
  if (!files.length) {
    list.innerHTML = `<div class="text-muted" style="font-size:.85rem;">Δεν υπάρχουν αρχεία ακόμα.</div>`;
    return;
  }
  list.innerHTML = files.map(f => {
    const kb = (f.size/1024).toFixed(0);
    return `
      <div class="file-row">
        <i class="bi bi-file-earmark-pdf text-danger fs-5"></i>
        <div class="fname">${f.name}</div>
        <small class="text-muted">${kb} KB</small>
        <a href="/api/download/${encodeURIComponent(f.name)}" download="${f.name}"
           class="btn btn-sm btn-outline-primary py-0 px-2">
          <i class="bi bi-download"></i>
        </a>
      </div>`;
  }).join("");
}

loadFiles(); updateDocSelection();
</script>
</body>
</html>
